<!DOCTYPE html><html lang="ja"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quvo Chat</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#18324a;background:#f2f7fc}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:11px 14px;background:#e8f1fb;color:#14568d}button.primary{background:#147fe0;color:white}button:disabled{opacity:.5}input,textarea{width:100%;padding:12px;border:1px solid #cbdcec;border-radius:10px;background:white;color:#17324d}h1{margin:0 0 14px;font-size:24px}.app{max-width:760px;margin:auto;min-height:100vh;background:white;display:flex;flex-direction:column}.head{background:#fff;padding:15px;border-bottom:1px solid #e2edf6;display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-weight:800;color:#1379d0;font-size:20px}.body{padding:16px;flex:1}.auth{max-width:390px;margin:60px auto;padding:22px;background:white;border-radius:20px;box-shadow:0 8px 30px #174c7715}.stack{display:grid;gap:12px}.tabs{display:flex;border-top:1px solid #dce8f3;background:white}.tabs button{flex:1;border-radius:0;background:white;font-size:13px}.tabs button.active{color:#147fe0;border-top:3px solid #147fe0}.item{padding:14px 8px;border-bottom:1px solid #edf1f6;display:flex;align-items:center;justify-content:space-between;gap:8px}.item .main{flex:1;min-width:0;cursor:pointer}.sub{font-size:12px;color:#708498;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill{background:#ed5b62;color:white;border-radius:20px;padding:2px 8px;font-size:12px}.chat{display:flex;flex-direction:column;min-height:70vh}.messages{flex:1;min-height:250px;max-height:65vh;overflow:auto;padding:12px;background:#eaf3fc;border-radius:12px}.bubble{padding:10px 13px;border-radius:15px;max-width:80%;background:white;overflow-wrap:anywhere;white-space:pre-wrap}.mine{margin-left:auto;background:#c7f2dc}.message{margin:10px 0;display:flex;flex-direction:column;align-items:flex-start}.message.self{align-items:flex-end}.meta{font-size:11px;color:#64788b;margin:4px 2px}.composer{display:flex;gap:8px;margin-top:10px}.composer textarea{resize:none;min-height:44px}.composer button{min-width:70px}.footer{text-align:center;color:#8497aa;font-size:11px;padding:12px}.notice{padding:10px;border-radius:10px;background:#eaf4ff;margin-bottom:12px}.error{color:#b92742}.small{font-size:12px}.hidden{display:none}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0}.row input{flex:1}
</style></head><body><div id="root"></div><script>
let token=sessionStorage.getItem('quvo_token')||'',currentUser=null,currentChat='',page='chats',poll=null,typingTimer=null,sendBusy=false;
const $=id=>document.getElementById(id);
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function api(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args));}
function error(e){alert(e?.message||String(e));}
function uid(){return crypto?.randomUUID?.()||Date.now()+'-'+Math.random().toString(36).slice(2);}
function format(t){try{return new Date(t).toLocaleString('ja-JP')}catch{return ''}}
function renderAuth(){stopPoll();$('root').innerHTML=`<section class="auth"><h1>Quvo Chat</h1><p class="sub">友だちとチャットしよう</p><div class="stack"><input id="username" placeholder="ユーザー名（英数字）" autocomplete="username"><input id="displayName" placeholder="表示名（新規登録のみ）"><input id="password" type="password" placeholder="パスワード（10文字以上）"><button class="primary" id="login">ログイン</button><button id="register">新規登録</button><p class="small error" id="authError"></p></div><div class="footer">©QuvoCorporation</div></section>`;$('login').onclick=()=>auth(false);$('register').onclick=()=>auth(true);}
async function auth(create){let b=$('login');b.disabled=true;try{let result=create?await api('register',$('username').value,$('displayName').value,$('password').value):await api('login',$('username').value,$('password').value);token=result.token;currentUser=result.user;sessionStorage.setItem('quvo_token',token);renderApp();}catch(e){$('authError').textContent=e.message||String(e)}finally{b.disabled=false}}
function stopPoll(){if(poll)clearInterval(poll);poll=null;}
function renderApp(){stopPoll();$('root').innerHTML=`<div class="app"><div class="head"><span class="brand">Quvo Chat</span><div class="row"><button id="bell" title="通知">🔔</button><button id="signout" title="ログアウト">ログアウト</button></div></div><main class="body" id="content"></main><nav class="tabs" id="tabs"><button data-tab="chats">💬 チャット</button><button data-tab="friends">👥 友だち</button><button data-tab="search">🔎 検索</button><button data-tab="settings">⚙️ 設定</button></nav><div class="footer">©QuvoCorporation</div></div>`;$('signout').onclick=async()=>{try{await api('logout',token)}catch{}token='';currentUser=null;sessionStorage.removeItem('quvo_token');renderAuth()};$('bell').onclick=showNotifications;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentChat='';page=b.dataset.tab;renderPage()});renderPage();poll=setInterval(refresh,5000);api('heartbeat',token).catch(()=>{});}
function renderPage(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===page&&!currentChat));if(currentChat)return showChat(currentChat);if(page==='chats')return showChats();if(page==='friends')return showFriends();if(page==='search')return showSearch();return showSettings();}
async function showChats(){try{let chats=await api('listChats',token);$('content').innerHTML=`<h2>チャット</h2><button id="group">＋ グループを作成</button><div id="list">${chats.map(c=>`<div class="item"><div class="main" data-chat="${escapeHtml(c.id)}"><b>${escapeHtml(c.name)}</b><div class="sub">${escapeHtml(c.lastText||'メッセージはまだありません')}</div></div>${c.unread?`<span class="pill">${c.unread}</span>`:''}</div>`).join('')||'<p class="sub">まだチャットがありません。友だちを追加してください。</p>'}</div>`;document.querySelectorAll('[data-chat]').forEach(el=>el.onclick=()=>{currentChat=el.dataset.chat;showChat(currentChat)});$('group').onclick=createGroupUI;}catch(e){error(e)}}
async function showFriends(){try{let [friends,requests]=await Promise.all([api('listFriends',token),api('friendRequests',token)]);let incoming=requests.filter(r=>r.status==='pending'&&r.toId===currentUser.id);$('content').innerHTML=`<h2>友だち</h2><h3>申請 (${incoming.length})</h3><div id="incoming">${incoming.map(r=>`<div class="item"><span>${escapeHtml(r.other.displayName)}</span><button data-accept="${escapeHtml(r.id)}">承認</button><button data-reject="${escapeHtml(r.id)}">拒否</button></div>`).join('')||'<p class="sub">申請なし</p>'}</div><h3>友だち (${friends.length})</h3>${friends.map(f=>`<div class="item"><div class="main"><b>${escapeHtml(f.displayName)}</b><div class="sub">@${escapeHtml(f.username)}</div></div><button data-start="${escapeHtml(f.id)}">チャット</button></div>`).join('')||'<p class="sub">まだ友だちはいません</p>'}`;document.querySelectorAll('[data-accept],[data-reject]').forEach(b=>b.onclick=async()=>{try{await api('respondFriend',token,b.dataset.accept||b.dataset.reject,!!b.dataset.accept);showFriends()}catch(e){error(e)}});document.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{try{currentChat=await api('startChat',token,b.dataset.start);showChat(currentChat)}catch(e){error(e)}})}catch(e){error(e)}}
function showSearch(){$('content').innerHTML=`<h2>ユーザー検索</h2><div class="row"><input id="query" placeholder="ユーザー名または表示名"><button id="go">検索</button></div><div id="results"></div>`;$('go').onclick=async()=>{try{let users=await api('searchUsers',token,$('query').value);$('results').innerHTML=users.map(u=>`<div class="item"><div class="main"><b>${escapeHtml(u.displayName)}</b><div class="sub">@${escapeHtml(u.username)}</div></div><button data-request="${escapeHtml(u.id)}">友だち申請</button></div>`).join('')||'<p class="sub">見つかりません</p>';document.querySelectorAll('[data-request]').forEach(b=>b.onclick=async()=>{try{await api('requestFriend',token,b.dataset.request);alert('申請しました')}catch(e){error(e)}})}catch(e){error(e)}}}
function showSettings(){$('content').innerHTML=`<h2>設定</h2><div class="notice"><b>${escapeHtml(currentUser.displayName)}</b><div>@${escapeHtml(currentUser.username)}</div></div><p>Quvo Chat テスト版</p><p class="small">Google スプレッドシートにメッセージを保存します。個人情報や機密情報を送信しないでください。</p><div class="footer">©QuvoCorporation</div>`;}
async function createGroupUI(){try{let f=await api('listFriends',token);if(!f.length){alert('まず友だちを追加してください');return}let name=prompt('グループ名');if(!name)return;let selected=f.filter(x=>confirm(x.displayName+'さんを追加しますか？')).map(x=>x.id);currentChat=await api('createGroup',token,name,selected);showChat(currentChat)}catch(e){error(e)}}
async function showChat(chatId){try{let [messages,members,chats]=await Promise.all([api('getMessages',token,chatId),api('chatMembers',token,chatId),api('listChats',token)]);if(currentChat!==chatId)return;let chat=chats.find(x=>x.id===chatId);$('content').innerHTML=`<div class="chat"><div class="row"><button id="back">← 戻る</button><b>${escapeHtml(chat?.name||'チャット')}</b><span id="typing" class="sub"></span></div><div class="messages" id="messages">${messages.map(m=>`<div class="message ${m.senderId===currentUser.id?'self':''}"><span class="meta">${escapeHtml(m.senderName)}</span><div class="bubble ${m.senderId===currentUser.id?'mine':''}">${escapeHtml(m.text)}</div><span class="meta">${escapeHtml(format(m.createdAt))}</span></div>`).join('')||'<p class="sub">メッセージを送ってみましょう</p>'}</div><div id="sendStatus" class="sub"></div><div class="composer"><textarea id="messageInput" rows="1" maxlength="5000" placeholder="メッセージを入力"></textarea><button class="primary" id="send">送信</button></div></div>`;$('back').onclick=()=>{currentChat='';showChats()};$('send').onclick=sendMessageUI;$('messageInput').oninput=()=>{api('setTyping',token,chatId,true).catch(()=>{})};$('messages').scrollTop=$('messages').scrollHeight;api('markRead',token,chatId).catch(()=>{});api('getTyping',token,chatId).then(names=>{if(currentChat===chatId&&$('typing'))$('typing').textContent=names.length?names.join('、')+' が入力中…':''}).catch(()=>{});}catch(e){error(e)}}
async function sendMessageUI(){if(sendBusy)return;let input=$('messageInput');if(!input||!input.value.trim())return;const text=input.value,chatId=currentChat,requestId=uid();sendBusy=true;$('send').disabled=true;$('sendStatus').textContent='送信中…';try{await api('sendMessage',token,chatId,text,requestId);if(currentChat===chatId){await showChat(chatId)}api('setTyping',token,chatId,false).catch(()=>{});}catch(e){if($('sendStatus'))$('sendStatus').textContent='送信状態を確認できません。重複防止のため再送する前にチャットを更新してください。';error(e)}finally{sendBusy=false;if($('send'))$('send').disabled=false}}
async function showNotifications(){try{let ns=await api('notifications',token);$('content').innerHTML=`<h2>通知</h2><button id="backNotices">← 戻る</button>${ns.map(n=>`<div class="item"><div class="main" data-notice="${escapeHtml(n.id)}"><b>${n.read?'':'🔵 '}${escapeHtml(n.title)}</b><div class="sub">${escapeHtml(n.body)}</div></div><button data-del="${escapeHtml(n.id)}">削除</button></div>`).join('')||'<p class="sub">通知はありません</p>'}`;$('backNotices').onclick=renderPage;document.querySelectorAll('[data-notice]').forEach(el=>el.onclick=async()=>{let n=ns.find(x=>x.id===el.dataset.notice);await api('readNotification',token,n.id);if(n.chatId){currentChat=n.chatId;showChat(currentChat)}else{page='friends';showFriends()}});document.querySelectorAll('[data-del]').forEach(el=>el.onclick=async()=>{try{await api('deleteNotification',token,el.dataset.del);showNotifications()}catch(e){error(e)}})}catch(e){error(e)}}
async function refresh(){if(!token)return;try{await api('heartbeat',token);if(currentChat){let id=currentChat;let messages=await api('getMessages',token,id);if(currentChat!==id)return;let list=$('messages');if(!list)return;let old=list.dataset.signature;let signature=messages.map(m=>m.id).join(',');if(old!==signature){let nearBottom=list.scrollHeight-list.scrollTop-list.clientHeight<100;list.innerHTML=messages.map(m=>`<div class="message ${m.senderId===currentUser.id?'self':''}"><span class="meta">${escapeHtml(m.senderName)}</span><div class="bubble ${m.senderId===currentUser.id?'mine':''}">${escapeHtml(m.text)}</div><span class="meta">${escapeHtml(format(m.createdAt))}</span></div>`).join('');list.dataset.signature=signature;if(nearBottom)list.scrollTop=list.scrollHeight;}await api('markRead',token,id);let typing=await api('getTyping',token,id);if($('typing')&&currentChat===id)$('typing').textContent=typing.length?typing.join('、')+' が入力中…':'';}}catch(e){console.warn(e)}}
(async()=>{if(token){try{currentUser=await api('me',token);renderApp()}catch{token='';sessionStorage.removeItem('quvo_token');renderAuth()}}else renderAuth()})();
</script></body></html>
